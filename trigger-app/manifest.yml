app:
  runtime:
    name: nodejs22.x
permissions:
  scopes:
    - read:pullrequest:bitbucket
    - read:pipeline:bitbucket
    - write:pipeline:bitbucket
modules:
  trigger:
    - key: ironbee-comment
      function: on-comment
      events:
        - avi:bitbucket:created:pullrequest-comment
  function:
    - key: on-comment
      handler: index.onComment
