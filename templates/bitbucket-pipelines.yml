pipelines:
  custom:
    ironbee-code-review:                          # IronBee's code review, release 1.0.0-rc.7
      - step:
          name: IronBee Code Review
          image:
            name: docker.io/ironbeeai/ironbee-code-review-runner@sha256:13a326fe34af9bb2bcc34b83717a0ed101e7a47efc7de93fefba2858b7b677a4
            username: ironbeeai
            password: $IRONBEE_REGISTRY_TOKEN
          # runs-on: [self.hosted, linux]         # your own runner, when the model is inside your network
          max-time: 120
          concurrency-group: ironbee-code-review-${{BITBUCKET_PR_ID}}
          clone:
            enabled: false
          auth:
            system:
              scopes:
                - read:pullrequest:bitbucket
                - write:pullrequest:bitbucket
                - read:repository:bitbucket
                - read:git:bitbucket
          script:
            - ironbee-runner

triggers:
  pullrequest-created:
    - condition: glob(BITBUCKET_BRANCH, "**")
      pipelines:
        - ironbee-code-review
  pullrequest-updated:
    - condition: glob(BITBUCKET_BRANCH, "**")
      pipelines:
        - ironbee-code-review
