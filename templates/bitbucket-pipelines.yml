pipelines:
  custom:
    ironbee-code-review:                          # IronBee's code review, release 1.1.0-rc.1
      - step:
          name: IronBee Code Review
          image:
            name: docker.io/ironbeeai/ironbee-code-review-runner@sha256:39da641e94d0f286bfa6de3b58605d35b21fca882208ead75c694f09ac5e7c1a
            username: ironbeeai
            password: $IRONBEE_REGISTRY_TOKEN
          # runs-on: [self.hosted, linux]         # your own runner, when the model is inside your network
          max-time: 120
          concurrency-group: ironbee-code-review-${{BITBUCKET_PR_ID}}
          clone:
            enabled: false
          auth:
            system:
              scopes:
                - read:pullrequest:bitbucket
                - write:pullrequest:bitbucket
                - read:repository:bitbucket
                - read:git:bitbucket
          script:
            - ironbee-runner

triggers:
  pullrequest-created:
    - condition: glob(BITBUCKET_BRANCH, "**")
      pipelines:
        - ironbee-code-review
  pullrequest-updated:
    - condition: glob(BITBUCKET_BRANCH, "**")
      pipelines:
        - ironbee-code-review
